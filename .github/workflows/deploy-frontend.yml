name: Desplegar frontend en AWS

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    name: EC2
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            cd ~/Ordenix
            git fetch --all --prune
            git checkout main
            git reset --hard origin/main

            cd frontend
            npm ci
            npm run build

            pm2 restart frontend-ordenix --update-env || pm2 start npm --name frontend-ordenix -- run start
            pm2 save

            for intento in $(seq 1 10); do
              if curl -fsS "http://127.0.0.1:3000" > /dev/null; then
                echo "Frontend saludable."
                exit 0
              fi
              echo "Esperando al frontend ($intento/10)..."
              sleep 3
            done

            echo "El frontend no respondio tras el despliegue."
            pm2 logs frontend-ordenix --lines 40 --nostream
            exit 1
